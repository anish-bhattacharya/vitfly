# 分支D: STH + Mamba 配置模板
# 模型架构: STH(Spatio-Temporal Hierarchical) + Mamba (~3.1M参数)

# 继承基础配置
_base_: base_config.yaml

# 分支特定配置
branch: D
model_type: STHMamba
experiment_name: mamba_branch_D

# 训练配置调整
lr: 1.1e-4  # 稍高的学习率
N_eps: 65  # 更多epoch，因为架构更复杂
lr_warmup_epochs: 10  # 更长的预热
batch_size: 1  # 轨迹级别批处理

# 正则化配置
weight_decay: 1.8e-5  # 较高的权重衰减
reg_lambda: 0.02  # 较高的L2正则化

# 优化器配置
optimizer: adamw
betas: [0.9, 0.999]
eps: 1.0e-8

# 实验标签
tags: [mamba, branch_D, sth, spatio_temporal, hierarchical]
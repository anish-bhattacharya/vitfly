<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body{margin:0;display:flex;justify-content:center;align-items:center;background:#fff}
  #chart{width:1050px;height:400px}
</style></head>
<body><div id="chart"></div>
<script>
var tasks = [
  { name: 'E distill seeds 43-45 / G BC seeds 43-45', cat: 2, start: 0, end: 28 },
  { name: 'B+ distill seed 42', cat: 2, start: 22, end: 34 },
  { name: 'G_basic/G_lstm 仿真测试', cat: 1, start: 5, end: 23 },
  { name: 'velocity bug 修复 + 复测', cat: 1, start: 24, end: 42 },
  { name: 'G_basic 多种子仿真', cat: 1, start: 45, end: 63 },
  { name: 'E distill 7m/s tracking', cat: 1, start: 65, end: 77 },
  { name: '论文/图表持续更新', cat: 0, start: 38, end: 93 },
];

var syncd = [
  { time: 28, label: 'multi-seed push' },
  { time: 34, label: 'B+ distill push' },
  { time: 63, label: 'sim results push' },
];

var ccat = [
  { fill: '#F4A261', stroke: '#D47B30' },
  { fill: '#5BA58B', stroke: '#3A7B6B' },
  { fill: '#4A90D9', stroke: '#2E5A9D' },
];
var cname = ['论文/文档', '仿真Agent', '训练Agent'];

var series = [];

// Main task bars as custom series
tasks.forEach(function(t) {
  series.push({
    type: 'custom',
    renderItem: function(params, api) {
      var y0 = api.coord([0, t.cat])[1];
      var rh = api.size([0, 1])[1];
      var y = y0 + rh*0.12;
      var h = rh*0.6;
      var x1 = api.coord([t.start, t.cat])[0];
      var x2 = api.coord([t.end, t.cat])[0];
      var w = Math.max(x2-x1, 5);
      var col = ccat[t.cat];
      var grp = [
        { type: 'rect', shape: {x:x1,y:y,width:w,height:h}, style: {fill:col.fill,stroke:col.stroke,lineWidth:1.2} },
        { type: 'rect', shape: {x:x1,y:y,width:4,height:h}, style: {fill:col.stroke} },
      ];
      var p = t.name;
      if (p.length > 14) {
        grp.push({ type: 'text', shape: {x:x1+10,y:y+16}, style: {text:p.substring(0,14),textFont:'bold 10px sans-serif',textFill:'#fff'} });
        grp.push({ type: 'text', shape: {x:x1+10,y:y+32}, style: {text:p.substring(15),textFont:'9px sans-serif',textFill:'#eef'} });
      } else {
        grp.push({ type: 'text', shape: {x:x1+10,y:y+22}, style: {text:p,textFont:'bold 10px sans-serif',textFill:'#fff'} });
      }
      return {type:'group', children:grp};
    },
    data: [0], z: 5,
  });
});

// Row labels
for (var i=0;i<3;i++) {
  series.push({
    type: 'bar',
    data: [{value:130, itemStyle:{color:'transparent'},
      label:{show:true,position:'insideLeft',color:'#333',fontSize:12,fontWeight:'bold',
        formatter:cname[i], padding:[0,0,0,40]}}],
    barWidth:50, barGap:'30%', z:0,
    xAxisIndex:0, yAxisIndex:0,
  });
}

// Sync markers
series.push({
  type: 'scatter',
  data: syncd.map(function(s){return{value:[s.time,2.5],label:{formatter:s.label.replace(' ','\n'),show:true,position:'top',fontSize:9,color:'#555',lineHeight:14}};}),
  symbol:'diamond',symbolSize:18,itemStyle:{color:'#444'},z:10,
});

var opt = {
  grid:{left:5,right:25,top:20,bottom:45},
  xAxis:{
    type:'value',min:-3,max:130,
    axisLabel:{formatter:function(v){var h=19+Math.floor(v/60);var m=v%60;return h+':'+(m<10?'0':'')+m;},fontSize:10,color:'#666'},
    axisLine:{show:true,lineStyle:{color:'#ccc'}},
    splitLine:{show:true,lineStyle:{color:'#eee',type:'dashed'}},
    axisTick:{show:false},
  },
  yAxis:{type:'category',data:['','',''],axisTick:{show:false},axisLine:{show:false},splitLine:{show:false},axisLabel:{show:false}},
  series:series,
  animation:false,
  tooltip:{show:false},
  toolbox:{
    feature:{
      saveAsImage:{
        title:'保存为PNG',
        pixelRatio:3,
        backgroundColor:'#ffffff',
        name:'gantt_chart',
      }
    },
    right:10,
    top:5,
  },
};

var c = echarts.init(document.getElementById('chart'));
c.setOption(opt);
window.addEventListener('resize',function(){c.resize();});
</script></body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分布式训练-仿真流水线甘特图</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Times New Roman','SimSun',serif;background:transparent;display:flex;flex-direction:column;align-items:center;padding:20px}
  #chart{width:100%;max-width:1000px;height:420px}
  .fig-label{text-align:center;font-size:11px;color:#333;margin-top:12px;font-family:'Times New Roman','SimSun',serif;max-width:960px}
  .btn-row{display:flex;justify-content:center;gap:14px;margin-top:16px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 20px;border:1.5px solid #2c5282;background:#fff;color:#2c5282;font-size:13px;cursor:pointer;border-radius:2px}
  .btn:hover{background:#2c5282;color:#fff}
</style>
</head>
<body>
<div id="chart"></div>
<div class="fig-label">
<strong>图注：</strong>蓝色 = 训练Agent（AutoDL云服务器）；绿色 = 仿真Agent（WSL2+ROS+Flightmare）；深灰 = GitHub 仓库同步。
</div>
<div class="btn-row">
  <button class="btn" onclick="downloadPNG()">📷 导出透明 PNG</button>
</div>

<script>
// ─── Categories ───
const yLabels = [
  '模型架构设计',
  'BC / 蒸馏训练',
  '权重推送 (push)',
  '拉取权重 (pull)',
  '速度曲线仿真测试',
  'Tracking 数据采集',
  '论文/图表更新',
];
const yIdx = Object.fromEntries(yLabels.map((l,i)=>[l,i]));

const COLORS = {
  train:  ['#4A90D9','#357ABD'],
  github: ['#555555','#444444'],
  sim:    ['#5BA58B','#3A9E78'],
  doc:    ['#F4A261','#D47B30'],
};

const ALPHA = 0.85;

const tasks = [
  // ── Design ──
  { name:'模型架构设计',         cat:'train', s:0,  e:3 },

  // ── Iter 1 ──
  { name:'BC / 蒸馏训练',        cat:'train', s:3,  e:10 },
  { name:'权重推送 (push)',       cat:'github',s:10, e:11 },
  { name:'拉取权重 (pull)',       cat:'sim',  s:11, e:12 },
  { name:'速度曲线仿真测试',       cat:'sim',  s:12, e:17 },
  { name:'Tracking 数据采集',     cat:'sim',  s:17, e:19 },

  // ── Iter 2 ──
  { name:'BC / 蒸馏训练',        cat:'train', s:19, e:26 },
  { name:'权重推送 (push)',       cat:'github',s:26, e:27 },
  { name:'拉取权重 (pull)',       cat:'sim',  s:27, e:28 },
  { name:'速度曲线仿真测试',       cat:'sim',  s:28, e:33 },
  { name:'Tracking 数据采集',     cat:'sim',  s:33, e:35 },
  { name:'论文/图表更新',         cat:'doc',  s:30, e:38 },

  // ── Iter 3 ──
  { name:'BC / 蒸馏训练',        cat:'train', s:35, e:42 },
  { name:'权重推送 (push)',       cat:'github',s:42, e:43 },
  { name:'拉取权重 (pull)',       cat:'sim',  s:43, e:44 },
  { name:'速度曲线仿真测试',       cat:'sim',  s:44, e:48 },
  { name:'论文/图表更新',         cat:'doc',  s:44, e:52 },
];

function hex2rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const catPalette = {train:COLORS.train, github:COLORS.github, sim:COLORS.sim, doc:COLORS.doc};

const seriesData = tasks.map(t => ({
  value: [yIdx[t.name], t.s, t.e, t.cat],
  itemStyle: { color: hex2rgba(catPalette[t.cat][0], ALPHA), borderColor: catPalette[t.cat][0], borderWidth: 1, borderRadius: 2 },
  label: {
    show: (t.e-t.s)>=2,
    formatter: function() {
      var n = t.name;
      if (n === 'BC / 蒸馏训练') return '训练';
      if (n === '速度曲线仿真测试') return '仿真测试';
      if (n === 'Tracking 数据采集') return 'Tracking';
      if (n === '论文/图表更新') return '论文';
      return n;
    },
    color:'#fff', fontSize:9.5, fontFamily:'SimSun,serif', position:'insideLeft', offset:[4,0],
  },
}));

var option = {
  backgroundColor: 'transparent',
  animation: false,
  grid: { top: 45, bottom: 8, left: 20, right: 20, containLabel: true },

  legend: {
    top: 4,
    itemWidth: 14, itemHeight: 10,
    textStyle: { fontSize: 10.5, fontFamily: 'Times New Roman, SimSun, serif', color: '#333' },
    data: [
      { name: '训练Agent (AutoDL)', icon:'rect', itemStyle:{color:hex2rgba(COLORS.train[0],ALPHA)} },
      { name: 'GitHub 仓库同步',    icon:'rect', itemStyle:{color:hex2rgba(COLORS.github[0],ALPHA)} },
      { name: '仿真Agent (WSL2)',   icon:'rect', itemStyle:{color:hex2rgba(COLORS.sim[0],ALPHA)} },
      { name: '论文/文档',          icon:'rect', itemStyle:{color:hex2rgba(COLORS.doc[0],ALPHA)} },
    ],
  },

  xAxis: {
    type: 'value', min: 0, max: 55, interval: 5,
    name: '时间 / Day', nameLocation: 'end',
    nameTextStyle: { fontSize: 11, fontFamily:'Times New Roman,serif', color:'#444' },
    axisLabel: { fontSize: 10, fontFamily:'Times New Roman,serif', color:'#555', formatter: function(v){return 'D'+v;} },
    axisLine: { lineStyle: {color:'#888',width:1} },
    splitLine: { lineStyle: {color:'#eee',type:'solid'} },
  },

  yAxis: {
    type: 'category', data: yLabels, inverse: false,
    axisLabel: { fontSize: 10.5, fontFamily:'SimSun,Times New Roman,serif', color:'#222', width:110, overflow:'break' },
    axisLine: { lineStyle: {color:'#888',width:1} },
    axisTick: { show: false },
    splitLine: { show: false },
  },

  series: [{
    type: 'custom',
    renderItem: function(params, api) {
      var yIdx = api.value(0);
      var start = api.coord([api.value(1), yIdx]);
      var end = api.coord([api.value(2), yIdx]);
      var height = api.size([0,1])[1] * 0.5;
      var x = start[0], y = start[1] - height/2, w = end[0] - start[0];
      return { type:'rect', shape:{x:x,y:y,width:w,height:h,r:2}, style:api.style(), styleEmphasis:api.styleEmphasis() };
    },
    encode: { x:[1,2], y:0 },
    data: seriesData,
    label: { show:false },
    markArea: {
      silent: true,
      label: { show:true, position:'insideTop', fontSize:9.5, fontFamily:'Times New Roman,SimSun,serif', color:'#888', fontStyle:'italic' },
      itemStyle: { opacity:0 },
      data: [
        [{ name:'迭代 1', xAxis:3 }, { xAxis:19 }],
        [{ name:'迭代 2', xAxis:19 }, { xAxis:35 }],
        [{ name:'迭代 3', xAxis:35 }, { xAxis:55 }],
      ],
    },
  }, {
    type: 'line', data: [],
    markLine: {
      silent: true, symbol:['none','none'],
      lineStyle: { color:'#bbb', type:'dashed', width:1 },
      label: { show:false },
      data: [19, 35].map(function(x){return {xAxis:x};}),
    },
  }],
};

var chart = echarts.init(document.getElementById('chart'), null, {renderer:'canvas'});
chart.setOption(option);
window.addEventListener('resize', function(){chart.resize();});

function downloadPNG() {
  var w=chart.getWidth(), h=chart.getHeight();
  var hiChart = echarts.init(document.createElement('canvas'), null, {renderer:'canvas', width:w*3, height:h*3});
  var hiOpt = JSON.parse(JSON.stringify(option));
  hiOpt.backgroundColor = 'transparent';
  hiChart.setOption(hiOpt);
  var dataURL = hiChart.getDataURL({type:'png', pixelRatio:3, backgroundColor:'transparent'});
  hiChart.dispose();
  var a = document.createElement('a');
  a.href = dataURL;
  a.download = 'distributed_training_gantt.png';
  a.click();
}
</script>
</body>
</html>
